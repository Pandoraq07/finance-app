<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PREMIUM FEATURES -->
    <section class="premium-panel" id="premiumPanel">
      <div class="premium-header">
        <div>
          <h2 class="section-title">Premium Tools</h2>
          <p class="premium-sub">Unlock statements, charts, and income tracking after subscribing.</p>
        </div>
      </div>
      <div class="premium-grid">
        <button class="premium-tool locked-feature" type="button" data-feature="statements">
          <span class="premium-tool-title">Statements</span>
          <span class="premium-tool-copy">Download monthly CSV/PDF reports</span>
        </button>
        <button class="premium-tool locked-feature" type="button" data-feature="charts">
          <span class="premium-tool-title">Pie Charts</span>
          <span class="premium-tool-copy">View spending by category</span>
        </button>
        <button class="premium-tool locked-feature" type="button" data-feature="income">
          <span class="premium-tool-title">Income Tracking</span>
          <span class="premium-tool-copy">Track salary, business, and side income</span>
        </button>
      </div>
    </section>
</body>
</html>
