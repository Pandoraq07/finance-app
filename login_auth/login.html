<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPal — Login</title>
  <link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <div class="auth-grid"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark">F</div>
        <span class="logo-name">FinPal</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your account</p>

      <form class="auth-form" id="loginForm">
        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <input class="auth-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <p class="error-msg" id="errorMsg"></p>
        <button class="auth-btn" type="submit">Sign in</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
      <p class="auth-tagline">Track your spending. Own your future.</p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorMsg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      const result = await loginUser(email, password);
      
      if (!result.success) {
        errorMsg.textContent = result.message;
        return;
      }
      window.location.href = '../finance-app/index.html';
    });
  </script>
</body>
</html>
